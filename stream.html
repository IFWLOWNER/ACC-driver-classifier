<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IFWL Live Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* OBS: Browser Source, 1920 x 1080, transparent background. Add ?bg=1 to preview on a dark backdrop. */
    :root{ --orb:Orbitron,Rajdhani,"Segoe UI",Arial,sans-serif; --teal:#14c8b0; --red:#ff4d55; --amber:#ffb454; --blue:#5aa9ff; --violet:#b69cff; --ink:#f2f6fc; --mute:#a9b6cc; --glass:linear-gradient(135deg,rgba(6,12,28,.94),rgba(12,22,46,.9)); }
    *{ box-sizing:border-box; }
    html,body{ margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
    body.bg{ background:#0b1020 url("./ifwl_bg.webp") center/cover; }
    body.bg::before{ content:""; position:fixed; inset:0; background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 24px,transparent 24px 48px); }
    #stage{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; font-family:Rajdhani,"Segoe UI",Arial,sans-serif; color:var(--ink); overflow:hidden; }
    .orb{ font-family:var(--orb); }

    /* ---------- permanent HUD ---------- */
    .hud{ position:absolute; z-index:30; left:48px; top:36px; display:flex; align-items:center; gap:18px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.55)); }
    .hud img{ height:74px; width:auto; }
    .live{ display:flex; align-items:center; gap:10px; background:rgba(6,12,28,.88); border:2px solid var(--red); border-radius:10px; padding:8px 16px; font-family:var(--orb); font-weight:800; font-size:20px; letter-spacing:.16em; }
    .live i{ width:14px; height:14px; border-radius:50%; background:var(--red); box-shadow:0 0 12px var(--red); animation:pulse 1.4s infinite; }
    @keyframes pulse{ 50%{ opacity:.35; transform:scale(.8);} }
    .live.rerun{ border-color:#7d8aa3; color:#c9d3e6; letter-spacing:.12em; }
    .live.rerun i{ background:#7d8aa3; box-shadow:none; animation:none; }
    .live .who{ font-family:Rajdhani,"Segoe UI",Arial,sans-serif; font-weight:700; letter-spacing:.04em; font-size:24px; color:#fff; margin-left:2px; }
    /* driver compare: bottom centre, next to the pop-up box (layout from the Restream overlay basis, 1920x1080) */
    .cmpGroup{ position:absolute; left:682px; top:690px; width:537px; height:303px; --glass2:linear-gradient(180deg,rgba(6,12,28,.9),rgba(12,22,46,.95)); }
    .cmpGroup.one{ left:817px; width:266px; }
    .cmpTag{ position:absolute; top:0; left:267px; transform:translateX(-50%); white-space:nowrap; font-family:var(--orb); font-weight:900; font-size:15px; letter-spacing:.16em; color:#04141a; background:var(--teal); padding:5px 12px; border-radius:7px; }
    .cmpGroup.one .cmpTag{ left:226px; }
    .cav{ position:absolute; bottom:0; width:81px; height:271px; display:flex; align-items:flex-end; justify-content:center; background:var(--glass2); border:2px solid var(--sc); border-bottom-width:4px; border-radius:14px 14px 0 0; overflow:hidden; box-shadow:0 14px 34px rgba(0,0,0,.55); }
    .cav.l{ left:186px; } .cav.r{ left:269px; }
    .cav img.figure{ max-width:100%; max-height:100%; object-fit:contain; filter:drop-shadow(0 8px 8px rgba(0,0,0,.6)); }
    .cav img.face{ width:70px; height:70px; border-radius:50%; object-fit:cover; border:3px solid var(--sc); margin-bottom:14px; }
    .cav .sil{ height:150px; opacity:.5; margin-bottom:8px; }
    .ci{ position:absolute; bottom:0; width:187px; height:110px; padding:6px 12px 6px; background:var(--glass2); border:2px solid var(--sc); border-bottom-width:4px; box-shadow:0 14px 34px rgba(0,0,0,.55); display:flex; flex-direction:column; justify-content:center; gap:1px; overflow:hidden; }
    .ci.l{ left:0; border-radius:14px 0 0 0; border-right-width:0; } .ci.r{ left:349px; width:188px; border-radius:0 14px 0 0; border-left-width:0; }
    .cmpGroup.one .ci.l{ left:0; }
    .ci .n{ font-weight:700; font-size:23px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-bottom:1px; margin-bottom:1px; flex:0 0 auto; border-bottom:1px solid rgba(255,255,255,.18); }
    .ci .n .num{ color:var(--sc); margin-right:6px; }
    .ci .ln{ display:flex; align-items:baseline; justify-content:space-between; gap:4px; font-size:15px; font-weight:600; color:var(--mute); white-space:nowrap; line-height:1.1; }
    .ci .ln b{ font-size:23px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
    .ci .ln b small{ font-size:14px; font-weight:600; color:var(--mute); margin-left:5px; }
    .ci .ln b.win{ color:var(--sc); text-shadow:0 0 14px rgba(255,255,255,.18); }
    .nextChip{ position:absolute; right:48px; top:40px; display:none; align-items:center; gap:14px; background:rgba(6,12,28,.88); border:2px solid var(--teal); border-radius:12px; padding:10px 18px; font-size:26px; font-weight:700; filter:drop-shadow(0 4px 12px rgba(0,0,0,.55)); }
    .nextChip .tg{ font-family:var(--orb); font-size:15px; letter-spacing:.14em; color:#04141a; background:var(--teal); padding:5px 10px; border-radius:5px; }
    .nextChip b{ font-variant-numeric:tabular-nums; color:var(--teal); }

    /* ---------- ticker ---------- */
    .ticker{ position:absolute; left:0; right:0; bottom:0; height:70px; display:flex; background:linear-gradient(90deg,rgba(4,9,22,.97),rgba(8,16,36,.94)); border-top:2px solid var(--teal); }
    .tkLabel{ flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:0 30px 0 26px; background:var(--teal); color:#03141a; font-family:var(--orb); font-weight:900; font-size:19px; letter-spacing:.16em; clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%); position:relative; z-index:2; }
    .tkView{ flex:1; overflow:hidden; position:relative; }
    .tkTrack{ position:absolute; left:0; top:0; width:max-content; height:100%; display:flex; align-items:center; white-space:nowrap; will-change:transform; }
    .tk{ flex:0 0 auto; display:inline-flex; align-items:center; gap:12px; height:70px; padding:0 30px; font-size:30px; font-weight:600; border-right:1px solid rgba(255,255,255,.12); }
    .tk .tag{ font-family:var(--orb); font-size:15px; font-weight:800; letter-spacing:.12em; padding:5px 11px; border-radius:5px; color:#04141a; background:var(--teal); }
    .tk .tag.amber{ background:var(--amber); } .tk .tag.blue{ background:var(--blue); } .tk .tag.violet{ background:var(--violet); } .tk .tag.red{ background:var(--red); color:#fff; }
    .tk.ann{ background:rgba(255,180,84,.14); }
    .tk em{ font-style:normal; color:var(--teal); font-weight:700; }
    .tk .dim{ color:var(--mute); }

    /* ---------- scenes ---------- */
    #scenes{ position:absolute; inset:0; pointer-events:none; }
    /* every pop-up lives in this box (665 x 410 at the bottom right). Scenes are laid out at their natural size and scaled to fit by fitScene(). */
    #pop{ position:absolute; left:1255px; top:583px; width:665px; height:410px; }
    #pop .pop{ position:absolute; inset:0; }
    .scene{ position:absolute; }
    #pop .scene{ inset:auto auto 0 0; transform-origin:0 100%; }
    #pop .scene.annc{ width:900px; }
    .annc.bigx .tx{ font-size:62px; }
    .panel{ background:var(--glass); border:2px solid var(--accent,var(--teal)); border-radius:22px; box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 36px rgba(20,200,176,.22); backdrop-filter:blur(10px); position:relative; overflow:hidden; }
    .panel::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 3px,transparent 3px 46px); pointer-events:none; }
    .tab{ display:inline-block; font-family:var(--orb); font-weight:900; font-size:17px; letter-spacing:.18em; color:#04141a; background:var(--accent,var(--teal)); padding:7px 16px; border-radius:7px; }
    .pill{ display:inline-block; font-size:22px; font-weight:700; padding:3px 16px; border-radius:99px; border:2px solid var(--accent,var(--teal)); color:var(--accent,var(--teal)); }

    /* person card (new licence / level change) */
    .scene.person{ left:60px; bottom:104px; width:760px; height:470px; }
    .person .figureBox{ position:absolute; left:6px; bottom:0; width:240px; height:470px; display:flex; align-items:flex-end; justify-content:center; z-index:2; }
    .person .figure{ max-height:100%; max-width:100%; object-fit:contain; filter:drop-shadow(0 18px 18px rgba(0,0,0,.65)); }
    .person .face{ width:170px; height:170px; border-radius:50%; object-fit:cover; border:4px solid var(--accent); margin-bottom:38px; box-shadow:0 10px 26px rgba(0,0,0,.6); }
    .person .sil{ height:300px; opacity:.55; margin-bottom:14px; }
    .person .panel{ position:absolute; left:120px; right:0; bottom:0; height:214px; padding:22px 28px 20px 150px; }
    .person .nm{ font-family:var(--orb); font-weight:800; font-size:40px; line-height:1.1; margin-top:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .person .nm .num{ color:var(--accent); margin-right:10px; }
    .person .sub{ margin-top:10px; font-size:26px; color:var(--mute); font-weight:600; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
    .person .msg{ margin-top:8px; font-size:28px; font-weight:700; }
    .person .arrow{ color:var(--accent); font-weight:800; }

    /* boards */
    .scene.board{ left:60px; bottom:104px; width:720px; }
    .board .panel{ padding:22px 26px 18px; }
    .board h2{ margin:12px 0 8px; font-family:var(--orb); font-size:30px; font-weight:800; letter-spacing:.04em; }
    .board .row{ display:grid; grid-template-columns:54px 56px 1fr auto auto; gap:14px; align-items:center; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.12); font-size:32px; font-weight:700; opacity:0; animation:rowIn .55s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i)*.14s + .55s); }
    .board .row:last-child{ border-bottom:0; }
    .board .rk{ font-family:var(--orb); font-weight:900; font-size:34px; color:var(--accent); text-align:center; }
    .board .av{ width:54px; height:54px; border-radius:50%; object-fit:cover; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.2); }
    .board .nmx{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .board .nmx small{ color:var(--accent); margin-right:8px; font-size:24px; }
    .board .lv{ font-size:22px; color:var(--mute); font-weight:600; }
    .board .sc{ font-family:var(--orb); font-weight:800; font-size:30px; min-width:90px; text-align:right; }
    .board .empty{ padding:18px 0; font-size:28px; color:var(--mute); }
    @keyframes rowIn{ from{ opacity:0; transform:translateX(-50px);} to{ opacity:1; transform:none; } }

    /* upcoming */
    .scene.events{ left:60px; bottom:104px; width:820px; }
    .events .panel{ padding:22px 28px 22px; }
    .events .big{ margin-top:14px; font-family:var(--orb); font-weight:800; font-size:42px; line-height:1.12; }
    .events .when{ margin-top:6px; font-size:30px; color:var(--mute); font-weight:600; }
    .events .count{ margin-top:10px; font-family:var(--orb); font-weight:900; font-size:64px; color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
    .events .chips{ margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; }
    .events .more{ margin-top:16px; border-top:1px solid rgba(255,255,255,.14); padding-top:10px; }
    .events .ln{ display:flex; justify-content:space-between; gap:18px; font-size:28px; font-weight:600; padding:5px 0; }
    .events .ln span:last-child{ color:var(--mute); white-space:nowrap; }
    .events .cta{ margin-top:14px; font-size:26px; font-weight:700; color:var(--teal); }

    /* announcement banner */
    .scene.annc{ left:60px; right:60px; bottom:104px; }
    .annc .panel{ --accent:var(--amber); display:flex; align-items:center; gap:28px; padding:22px 34px; }
    .annc .tab{ font-size:22px; padding:12px 20px; flex:0 0 auto; }
    .annc .tx{ font-size:46px; font-weight:700; line-height:1.15; }

    /* full-screen scenes */
    .scene.full{ inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at center,rgba(3,8,20,.74),rgba(3,8,20,.9)); }
    .full .panel{ padding:40px 54px; }
    .full .bigAnn{ width:1480px; text-align:center; --accent:var(--amber); }
    .full .bigAnn .tab{ font-size:26px; padding:10px 24px; }
    .full .bigAnn .tx{ margin-top:26px; font-size:84px; font-weight:700; line-height:1.1; }
    .full .logoTop{ height:110px; margin-bottom:6px; }
    .full .spot{ width:1500px; display:grid; grid-template-columns:1fr 1fr; gap:48px; }
    .full .spot h2{ font-size:38px; }
    .full .spot .board .row,.full .spot .row{ font-size:34px; }
    .scene.promo{ left:60px; bottom:104px; width:760px; }
    .promo .panel{ padding:24px 30px; display:flex; gap:24px; align-items:center; }
    .promo img{ height:120px; width:auto; }
    .promo h3{ margin:0; font-family:var(--orb); font-size:38px; font-weight:900; }
    .promo p{ margin:6px 0 0; font-size:28px; color:var(--mute); font-weight:600; }
    .promo .url{ margin-top:8px; font-family:var(--orb); font-size:28px; font-weight:800; color:var(--teal); }
    .full .promoBig{ width:1180px; text-align:center; }
    .full .promoBig h3{ font-size:76px; } .full .promoBig p{ font-size:40px; } .full .promoBig .url{ font-size:50px; margin-top:16px; }

    /* v17: driver highlight, markets, shops, sponsors, team, numbers */
    .scene.person.hl .panel{ height:262px; padding:20px 28px 20px 150px; }
    .scene.person.hl{ width:900px; }
    .hl .nm{ padding-right:230px; margin-top:12px; font-size:38px; }
    .hl .sub,.hl .msg{ padding-right:230px; }
    .hl .score{ position:absolute; right:30px; top:58px; text-align:center; width:200px; }
    .hl .score b{ display:block; font-family:var(--orb); font-weight:900; font-size:92px; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums; text-shadow:0 0 26px rgba(255,180,84,.45); }
    .hl .score small{ display:block; margin-top:2px; font-family:var(--orb); font-size:15px; letter-spacing:.16em; color:var(--mute); font-weight:800; }
    .hl .msg{ font-size:26px; color:var(--mute); font-weight:600; }
    .hl .msg b{ color:var(--ink); }
    .scene.mk{ left:60px; bottom:104px; width:1000px; }
    .mk .panel{ padding:22px 28px 22px; }
    .mk h2{ margin:12px 0 4px; font-family:var(--orb); font-size:32px; font-weight:800; letter-spacing:.04em; }
    .mk .subh{ font-size:26px; color:var(--mute); font-weight:600; margin-bottom:12px; }
    .mk .cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
    .mk .card{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); border-radius:16px; padding:14px; text-align:center; opacity:0; animation:cardIn .6s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i)*.18s + .5s); }
    .mk .card .pic{ height:150px; display:flex; align-items:center; justify-content:center; }
    .mk .card .pic img{ max-width:100%; max-height:100%; object-fit:contain; filter:drop-shadow(0 8px 10px rgba(0,0,0,.5)); }
    .mk .card .ph{ width:110px; height:110px; border-radius:18px; border:2px dashed rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-family:var(--orb); font-weight:900; font-size:34px; color:var(--mute); }
    .mk .card .t{ margin-top:8px; font-size:30px; font-weight:700; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mk .card .pr{ margin-top:4px; font-family:var(--orb); font-weight:900; font-size:34px; color:var(--accent); }
    .mk .card .by{ margin-top:4px; font-size:22px; color:var(--mute); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mk .card .offer{ margin-top:8px; display:inline-block; font-size:19px; font-weight:700; padding:2px 12px; border-radius:99px; background:var(--accent); color:#04141a; }
    @keyframes cardIn{ from{ opacity:0; transform:translateY(34px) scale(.96);} to{ opacity:1; transform:none; } }
    .mk .foot{ margin-top:14px; border-top:1px solid rgba(255,255,255,.14); padding-top:10px; font-size:26px; font-weight:600; color:var(--mute); }
    .mk .foot b{ color:var(--ink); }
    .mk .srow{ display:grid; grid-template-columns:64px 1fr auto; gap:16px; align-items:center; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.12); opacity:0; animation:rowIn .55s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i)*.16s + .5s); }
    .mk .srow:last-of-type{ border-bottom:0; }
    .mk .srow img{ width:64px; height:64px; object-fit:contain; }
    .mk .srow .ph{ width:56px; height:56px; border-radius:12px; border:2px dashed rgba(255,255,255,.25); }
    .mk .srow .a{ font-size:31px; font-weight:700; line-height:1.1; }
    .mk .srow .b{ font-size:22px; color:var(--mute); font-weight:600; }
    .mk .srow .p{ font-family:var(--orb); font-weight:900; font-size:32px; color:var(--accent); text-align:right; }
    .mk.shop .panel{ padding:0; }
    .mk.shop .banner{ position:relative; padding:24px 28px 18px; background-size:cover; background-position:center; }
    .mk.shop .banner::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(6,12,28,.94),rgba(6,12,28,.7)); }
    .mk.shop .banner > *{ position:relative; z-index:1; }
    .mk.shop .own{ display:flex; align-items:center; gap:22px; margin-top:12px; }
    .mk.shop .own img{ width:96px; height:96px; border-radius:50%; object-fit:cover; object-position:top; background:rgba(255,255,255,.1); border:3px solid var(--accent); }
    .mk.shop .own .sn{ font-family:var(--orb); font-weight:900; font-size:44px; line-height:1.05; }
    .mk.shop .own .on{ font-size:26px; color:var(--mute); font-weight:600; margin-top:4px; }
    .mk.shop .body{ padding:6px 28px 20px; }
    .mk.team .tm{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:6px; }
    .mk.team .tm .m{ text-align:center; opacity:0; animation:cardIn .6s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i)*.18s + .5s); }
    .mk.team .tm .m .fg{ height:230px; display:flex; align-items:flex-end; justify-content:center; }
    .mk.team .tm .m .fg img{ max-height:100%; max-width:100%; object-fit:contain; filter:drop-shadow(0 12px 12px rgba(0,0,0,.6)); }
    .mk.team .tm .m .fg .sil{ height:170px; opacity:.45; }
    .mk.team .tm .m .n{ font-size:25px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mk.team .tm .m .s{ font-family:var(--orb); font-weight:900; font-size:26px; color:var(--accent); }
    .mk.team .big{ font-family:var(--orb); font-weight:900; font-size:50px; margin:10px 0 2px; line-height:1.05; }
    .scene.mk.spons{ width:1000px; }
    .spons .ban{ margin-top:14px; background:rgba(255,255,255,.96); border-radius:14px; padding:14px; display:flex; align-items:center; justify-content:center; }
    .spons .ban img{ max-width:100%; max-height:300px; object-fit:contain; }
    .mk.nums .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:10px; }
    .mk.nums .st{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); border-radius:16px; padding:16px; text-align:center; opacity:0; animation:cardIn .6s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i)*.14s + .5s); }
    .mk.nums .st b{ display:block; font-family:var(--orb); font-weight:900; font-size:58px; color:var(--accent); font-variant-numeric:tabular-nums; }
    .mk.nums .st span{ font-size:24px; color:var(--mute); font-weight:700; letter-spacing:.04em; }
    .full .sponsBig{ width:1500px; text-align:center; }
    .full .sponsBig .ban{ margin-top:20px; background:rgba(255,255,255,.96); border-radius:18px; padding:26px; display:flex; justify-content:center; }
    .full .sponsBig .ban img{ max-width:100%; max-height:520px; object-fit:contain; }
    .full .sponsBig p{ font-size:36px; color:var(--mute); font-weight:600; margin:18px 0 0; }
    /* message wall speech bubble */
    .scene.person.wall{ width:960px; }
    .wall .bub{ position:absolute; left:190px; right:0; bottom:14px; background:#fff; color:#0c1424; border-radius:30px; padding:22px 34px 24px; box-shadow:0 20px 54px rgba(0,0,0,.6); }
    .wall .bub::before{ content:""; position:absolute; left:-26px; bottom:56px; border:16px solid transparent; border-right:26px solid #fff; border-left:0; }
    .wall .bub .tab{ background:#14c8b0; font-size:15px; }
    .wall .bub .who{ margin-top:12px; font-family:var(--orb); font-weight:800; font-size:26px; color:#51607a; }
    .wall .bub .who .num{ color:#0e9f8c; margin-right:8px; }
    .wall .bub .tx{ margin-top:8px; font-size:46px; line-height:1.16; font-weight:700; overflow-wrap:anywhere; }
    .wall .bub .tx.long{ font-size:36px; }

(() => {

  const TRANS = (Q.get('trans') || 'wipe,slide,rise,zoom').split(',').map((s) => s.trim()).filter(Boolean);
  if (Q.has('bg')) document.body.classList.add('bg');

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const imgUrl = (u) => { u = String(u || ''); return /^https:\/\//i.test(u) || (DEMO && (/^[\w./-]+\.(png|jpg|webp)$/i.test(u) || /^data:image\/svg\+xml/.test(u))) ? u : ''; };

  /* ---- fit the 1920x1080 stage to whatever size the browser source is ---- */
  function fit(){ const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('stage').style.transform = 'scale(' + s + ')'; }
  addEventListener('resize', fit); fit();

  /* ---- small helpers ---- */
  function person(n){ const m = String(n || '').match(/^\s*\[\s*(\d+)\s*\]\s*-?\s*(.*)$/); return m ? { num: m[1], name: m[2] || String(n) } : { num: '', name: String(n || 'Driver') }; }
  const tierLabel = (t) => String(t || '').replace(/^IFWL-/i, '').replace(/-/g, ' ');
  const gbp = (n) => '£' + Math.round(Number(n) || 0).toLocaleString('en-GB');
  function whenLabel(ms){ try{ return new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/London', weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }).format(new Date(ms)) + ' UK'; }catch(e){ return ''; } }
  function cd(ms){
    let s = Math.max(0, Math.floor(ms / 1000)); const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60); s -= m * 60;
    const p = (n) => String(n).padStart(2, '0');
    return d ? d + 'd ' + p(h) + 'h ' + p(m) + 'm' : h ? h + 'h ' + p(m) + 'm ' + p(s) + 's' : p(m) + 'm ' + p(s) + 's';
  }
  const SIL = '<svg class="sil" viewBox="0 0 100 160" aria-hidden="true"><circle cx="50" cy="30" r="20" fill="rgba(255,255,255,.4)"/><path d="M12 150c0-38 14-62 38-62s38 24 38 62z" fill="rgba(255,255,255,.3)"/></svg>';

  /* ---- data ---- */
  let feed = null, lastFeedOk = 0;

      newLicences:[{ id:'new|1', name:'[ 35 ] - badespielt', licenceNumber:'IFWL-2026-00035', tier:'No Licence', avatarUrl:k, photoUrl:'', atMs:n-36e5 }],
      tierChanges:[{ id:'tier|2|1', name:'[ 7 ] - GeordieP', licenceNumber:'IFWL-2026-00007', tier:'IFWL-GT-Pro', from:'IFWL-GT-Amateur', avatarUrl:k, photoUrl:'', atMs:n-72e5 }],
      boards:{ name:'IFWL Rating', top:[['[ 7 ] - GeordieP',812,'Gold'],['[ 8 ] - Niels Segers',790,'Gold'],['[ 9 ] - WendyW',744,'Silver'],['[ 12 ] - Ondrej B',701,'Silver'],['[ 82 ] - Olly knapton',655,'Silver']].map((r,i)=>({ name:r[0], s:r[1], l:r[2], rank:i+1, avatarUrl:'' })),

      market:{ activeListings:23, partSalesCount:11, partSalesTotal:86400,

        partSales:[['Engine',2,1,12000,'Sam Okoro','Alex Parts'],['Tyres',0,4,3600,'Jo Lin','Sam Tyres'],['Race fuel',0,60,300,'GeordieP','Alex Parts']].map((r,i)=>({ id:'sale|'+i, part:r[0], tier:r[1], qty:r[2], total:r[3], buyer:r[4], seller:'x', shop:r[5], atMs:Date.now()-(i+1)*17*6e4, imageUrl:ph(r[0].slice(0,2).toUpperCase(),'#b69cff') })),
        kit:{ open:true, forSale:14, sold7d:5,
          items:[['Race suit','Neon Drift',25000,'GeordieP',false],['Helmet','Union Flag',12000,'WendyW',true],['Race suit','Night Stage',40000,'Niels Segers',false]].map((r,i)=>({ id:'k'+i, type:r[0], title:r[1], price:r[2], creator:r[3], resale:r[4], previewUrl:ph(r[0]==='Helmet'?'HE':'SU','#5aa9ff') })),
          sales:[{ id:'ks1', title:'Neon Drift', type:'Race suit', price:27000, atMs:Date.now()-36e5, buyer:'Jo Lin', previewUrl:'' }] },
        sponsors:[{ imageUrl:ph('YOUR LOGO HERE','#ffffff','wide') }] },
      events:[{ id:'e1', title:'Monday Funday Round 7', platform:'pc', track:'Spa-Francorchamps', eventDateMs:n+2*36e5+12*6e4, open:true },{ id:'e2', title:'LMU Free Practice', free:true, platform:'pc', track:'Le Mans', eventDateMs:n+30*36e5, open:true },{ id:'e3', title:'Endurance Series Round 2', platform:'console', track:'Monza', eventDateMs:n+5*864e5, open:true }] };
  };
  async function pull(){
    try{
      if (DEMO){ feed = DEMO_FEED(); lastFeedOk = Date.now(); return; }

  /* ---- commentator on air + driver compare (small public call, polled every few seconds) ---- */
  const DEMO_LIVE = Q.get('live') ? { id:'1', name:Q.get('live'), avatarUrl:'', sinceMs:Date.now() } : null;
  const DEMO_CMP = () => { const k = 'assets/kit/stock-white.png', n = Q.get('cmp') === '1' ? 1 : 2;

      { id:'b', name:'[ 9 ] - WendyW', avatarUrl:k, photoUrl:'', tier:'IFWL-GT-Amateur', team:'Blue Apex', stats:st({ rating:744, level:'Silver', rank:19, races:16, wins:6, podiums:8, top10:15, best:1, avg:4.1, clean:94, penalties:0, points:0 }) }];

  async function pollLive(){

  function applyLive(){
    const L = liveState.live, tag = $('liveTag'), tx = $('liveTxt');

    else { tag.classList.add('rerun'); tx.textContent = 'RERUN OF PAST EVENTS'; }
  }
  function cmpFig(c, sc, side){

      }catch(e){ console.warn('compare failed', e); }
      cmpBusy = false; syncCompare();
    } else if (!c && cmpEl){
      cmpBusy = true; const old = cmpEl; cmpEl = null; cmpSeq = 0;
      try{ await old.animate(TR.rise.out, { duration:500, fill:'both' }).finished; }catch(e){}
      old.remove(); cmpBusy = false;

  }

  /* ---- ticker (right to left, items are added as there is room, so new data flows in without a jump) ---- */
  const track = $('tkTrack'); let tx = 0, tIdx = 0, tList = [];
  function buildTicker(){
    const f = feed || {}, out = [];
    (f.announcements || []).forEach((a) => out.push(() => '<span class="tk ann"><span class="tag amber">ANNOUNCEMENT</span>' + esc(a.text) + '</span>'));

  function nextTk(){ if (!tList.length) buildTicker(); const html = tList[tIdx % tList.length](); tIdx++; const d = document.createElement('div'); d.innerHTML = html; const el = d.firstChild; track.appendChild(el); el.dataset.w = el.offsetWidth; return el; }

  const pickTr = (full) => { const name = full ? (TRANS.includes('zoom') ? 'zoom' : TRANS[0]) : TRANS[trCount++ % TRANS.length]; return TR[name] || TR.wipe; };
  const POP_W = 665, POP_H = 410;
  function fitScene(inner){

    let ro = null; try{ ro = new ResizeObserver(() => fitScene(inner)); ro.observe(inner); }catch(e){}
    const tr = pickTr(false);
    el.style.visibility = ''; await el.animate(tr.in, { duration:750, easing:'cubic-bezier(.7,0,.2,1)', fill:'both' }).finished;
    await wait(def.dur || 12000);
    await el.animate(tr.out, { duration:650, easing:'cubic-bezier(.7,0,.2,1)', fill:'both' }).finished;
    if (ro) ro.disconnect(); el.remove();
  }

  function figureHtml(p){
    const kit = imgUrl(p.avatarUrl), photo = imgUrl(p.photoUrl);
    const inner = kit ? '<img class="figure" src="' + esc(kit) + '" alt="">' : photo ? '<img class="face" src="' + esc(photo) + '" alt="">' : SIL;
    return '<div class="figureBox">' + inner + '</div>';
  }
  function personScene(ev, kind){
    const p = person(ev.name), isNew = kind === 'new';
    const sub = isNew ? esc(ev.licenceNumber || '') : esc(tierLabel(ev.from)) + ' <span class="arrow">→</span>';
    return { cls:'person', accent: isNew ? 'var(--blue)' : 'var(--teal)', dur: 12000,
      html: figureHtml(ev) + '<div class="panel"><span class="tab">' + (isNew ? 'NEW DRIVER' : 'LICENCE UPDATE') + '</span>'
        + '<div class="nm">' + (p.num ? '<span class="num">#' + esc(p.num) + '</span>' : '') + esc(p.name) + '</div>'
        + '<div class="sub">' + sub + ' <span class="pill">' + esc(tierLabel(ev.tier)) + '</span></div>'
        + '<div class="msg">' + (isNew ? 'Welcome to IFWL!' : 'Congratulations on the new licence level!') + '</div></div>' };
  }
  function rowsHtml(rows, kind){
    if (!rows.length) return '<div class="empty">Nothing to show yet. Race this week to get on the board!</div>';
    return rows.map((r, i) => { const p = person(r.name), av = imgUrl(r.avatarUrl);
      const right = kind === 'top' ? '<span class="lv">' + esc(r.l || '') + '</span><span class="sc">' + r.s + '</span>'
        : kind === 'imp' ? '<span class="lv">' + r.from + ' → ' + r.to + '</span><span class="sc" style="color:var(--violet)">+' + r.delta + '</span>'
        : '<span class="lv">' + r.races + ' race' + (r.races === 1 ? '' : 's') + '</span><span class="sc" style="color:var(--amber)">' + gbp(r.net) + '</span>';
      return '<div class="row" style="--i:' + i + '"><span class="rk">' + (kind === 'top' ? (r.rank || i + 1) : i + 1) + '</span>' + (av ? '<img class="av" src="' + esc(av) + '" alt="">' : '<span class="av"></span>')
        + '<span class="nmx">' + (p.num ? '<small>#' + esc(p.num) + '</small>' : '') + esc(p.name) + '</span>' + right + '</div>'; }).join('');
  }
  const BOARDS = { top:{ title:'TOP 5 · HIGHEST RATED', tab:'THIS WEEK', accent:'var(--amber)', key:'top' }, imp:{ title:'MOST IMPROVED', tab:'THIS WEEK', accent:'var(--violet)', key:'improved' }, earn:{ title:'HIGHEST EARNERS', tab:'THIS WEEK', accent:'var(--green,#34d399)', key:'earners' } };
  function boardScene(kind){
    const b = feed && feed.boards; if (!b) return null; const m = BOARDS[kind]; const rows = b[m.key] || [];
    if (!rows.length && kind !== 'top') return null;
    return { cls:'board', accent:m.accent, dur: 4500 + rows.length * 1700 + 3500, html:'<div class="panel"><span class="tab">' + m.tab + '</span><h2>' + m.title + '</h2>' + rowsHtml(rows, kind) + '</div>' };
  }
  function eventsScene(){
    const ev = ((feed && feed.events) || []).filter((e) => e.eventDateMs > Date.now() - 30 * 60000); if (!ev.length) return null;
    const e = ev[0], more = ev.slice(1, 4);
    return { cls:'events', accent:'var(--teal)', dur:15000,
      html:'<div class="panel"><span class="tab">' + (e.free ? 'FREE EVENT' : 'NEXT RACE') + '</span><div class="big">' + esc(e.title) + '</div>'
        + '<div class="when">' + esc(whenLabel(e.eventDateMs)) + (e.track ? ' · ' + esc(e.track) : '') + '</div>'
        + '<div class="count" data-cd="' + e.eventDateMs + '">' + esc(cd(Math.max(0, e.eventDateMs - Date.now()))) + '</div>'
        + '<div class="chips">' + (e.platform ? '<span class="pill">' + (e.platform === 'console' ? 'CONSOLE' : 'PC') + '</span>' : '') + (e.open ? '<span class="pill" style="--accent:var(--teal)">SIGN-UPS OPEN</span>' : '<span class="pill" style="--accent:var(--red)">SIGN-UPS CLOSED</span>') + '</div>'
        + (more.length ? '<div class="more">' + more.map((m) => '<div class="ln"><span>' + esc(m.title) + '</span><span>' + esc(whenLabel(m.eventDateMs)) + '</span></div>').join('') + '</div>' : '')
        + '<div class="cta">Sign up at ' + SITE + '</div></div>' };
  }
  function annScene(a, full){
    const len = String(a.text).length, dur = Math.min(22000, 7000 + len * 110);
    return { cls:'annc' + (full ? ' bigx' : ''), dur, html:'<div class="panel"><span class="tab">ANNOUNCEMENT</span><div class="tx">' + esc(a.text) + '</div></div>' };
  }
  function promoScene(full){
    const n = feed && feed.totalLicences ? feed.totalLicences + ' licensed drivers and counting. ' : '';
    const body = '<h3>JOIN IFWL</h3><p>' + esc(n) + 'Free licence · driver ratings · careers · Kit Studio</p><div class="url">' + SITE + '</div>';
    return { cls:'promo', dur:11000, html:'<div class="panel"><img src="./ifwl_logo.png" alt=""><div>' + body + '</div></div>' };
  }
  function spotlightScene(){
    const b = feed && feed.boards; if (!b || !b.top.length) return promoScene(false);
    return boardScene('top');
  }

  /* ---- v17 scenes: driver highlight, parts market, shops, sales, Kit Market, teams, partners, numbers ---- */
  const mkt = () => (feed && feed.market) || null;
  const credits = (n) => Math.round(Number(n) || 0).toLocaleString('en-GB') + ' credits';
  const partName = (p) => esc(p.part) + (p.tier ? ' L' + p.tier : '');
  const shuffle = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  const ago = (ms) => { const m = Math.max(1, Math.round((Date.now() - ms) / 60000)); return m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
  const picHtml = (u, label) => { u = imgUrl(u); return u ? '<img src="' + esc(u) + '" alt="">' : '<div class="ph">' + esc(String(label || '?').slice(0, 2).toUpperCase()) + '</div>'; };
  const hlShown = []; let shopIdx = 0, teamIdx = 0, sponsIdx = 0;
  function highlightScene(){
    const list = (feed && feed.highlights) || []; if (!list.length) return null;
    let pool = list.filter((h) => !hlShown.includes(h.id)); if (!pool.length){ hlShown.length = 0; pool = list; }
    const h = pool[Math.floor(Math.random() * pool.length)]; hlShown.push(h.id); if (hlShown.length > 6) hlShown.shift();
    const p = person(h.name);
    const wk = h.delta ? ' · <b>' + (h.delta > 0 ? '+' : '') + h.delta + '</b> this week' : '';
    return { cls:'person hl', accent:'var(--amber)', dur:13000,
      html: figureHtml(h) + '<div class="panel"><span class="tab">DRIVER SPOTLIGHT</span>'
        + '<div class="nm">' + (p.num ? '<span class="num">#' + esc(p.num) + '</span>' : '') + esc(p.name) + '</div>'
        + '<div class="sub"><span class="pill">' + esc(h.lv) + '</span>' + (h.team ? '<span>' + esc(h.team) + '</span>' : '') + '</div>'
        + '<div class="msg">' + (h.rank && h.ranked && h.rank <= h.ranked / 2 ? 'Ranked <b>#' + h.rank + '</b> of ' + h.ranked + ' on the IFWL Rating' : '<b>' + h.raced + '</b> race' + (h.raced === 1 ? '' : 's') + ' on the IFWL Rating') + wk + '</div>'
        + '<div class="score"><b>' + h.s + '</b><small>IFWL RATING</small></div></div>' };
  }
  function partsScene(){
    const m = mkt(); const list = (m && m.parts) || []; if (!list.length) return null;
    const cards = shuffle(list).slice(0, 3);
    return { cls:'mk', accent:'var(--amber)', dur: 6000 + cards.length * 1800 + 4500,
      html:'<div class="panel"><span class="tab">PARTS MARKET</span><h2>FOR SALE FROM IFWL DRIVERS</h2><div class="subh">' + (m.activeListings || list.length) + ' listings live on the Marketplace</div><div class="cards">'
        + cards.map((x, i) => '<div class="card" style="--i:' + i + '"><div class="pic">' + picHtml(x.imageUrl, x.part) + '</div><div class="t">' + partName(x) + '</div><div class="pr">' + gbp(x.price) + (x.tier === 0 && x.part !== 'Race fuel' ? ' each' : x.part === 'Race fuel' ? ' / litre' : '') + '</div>'
          + '<div class="by">' + (x.qty > 1 ? x.qty + ' in stock · ' : '') + esc(x.shop || x.seller) + '</div>' + (x.offer ? '<div class="offer">' + esc(x.offer) + '</div>' : '') + '</div>').join('')
        + '</div><div class="foot">Browse the Marketplace on <b>' + SITE + '</b></div></div>' };
  }
  function shopScene(){
    const m = mkt(); const shops = (m && m.shops) || []; if (!shops.length) return null;
    const sh = shops[shopIdx++ % shops.length]; const bg = imgUrl(sh.bg), face = imgUrl(sh.avatarUrl) || imgUrl(sh.photoUrl);
    return { cls:'mk shop', accent:'var(--violet)', dur: 6000 + sh.items.length * 1800 + 4500,
      html:'<div class="panel"><div class="banner"' + (bg ? ' style="background-image:url(&quot;' + esc(bg) + '&quot;)"' : '') + '><span class="tab">SHOP SPOTLIGHT</span>'
        + '<div class="own">' + (face ? '<img src="' + esc(face) + '" alt="">' : '') + '<div><div class="sn">' + esc(sh.shop) + '</div><div class="on">run by ' + esc(sh.owner) + ' · ' + sh.listings + ' listing' + (sh.listings === 1 ? '' : 's') + ' live</div></div></div></div>'
        + '<div class="body">' + sh.items.map((x, i) => '<div class="srow" style="--i:' + i + '">' + picHtml(x.imageUrl, x.part) + '<div><div class="a">' + partName(x) + (x.qty > 1 ? ' <span style="color:var(--mute);font-weight:600">x' + x.qty + '</span>' : '') + '</div>' + (x.offer ? '<div class="b">' + esc(x.offer) + '</div>' : '') + '</div><div class="p">' + gbp(x.price) + '</div></div>').join('')
        + '<div class="foot">Find this shop on <b>' + SITE + '</b></div></div></div>' };
  }
  function soldScene(){
    const m = mkt(); const sales = ((m && m.partSales) || []).slice(0, 4); if (!sales.length) return null;
    const n = m.partSalesCount || 0, capped = n >= 40;
    return { cls:'mk', accent:'var(--red)', dur: 6000 + sales.length * 1700 + 4000,
      html:'<div class="panel"><span class="tab" style="background:var(--red);color:#fff">JUST SOLD</span><h2>LATEST PARTS SALES</h2><div class="subh">' + (capped ? '40+' : n) + ' sale' + (n === 1 ? '' : 's') + ' in the last 7 days' + (!capped && m.partSalesTotal ? ' · ' + gbp(m.partSalesTotal) + ' traded' : '') + '</div>'
        + sales.map((x, i) => '<div class="srow" style="--i:' + i + '">' + picHtml(x.imageUrl, x.part) + '<div><div class="a">' + partName(x) + (x.qty > 1 ? ' x' + x.qty : '') + '</div><div class="b">' + esc(x.buyer) + ' bought from ' + esc(x.shop || x.seller) + ' · ' + esc(ago(x.atMs)) + '</div></div><div class="p">' + gbp(x.total) + '</div></div>').join('') + '</div>' };
  }
  function kitScene(){
    const m = mkt(); const k = m && m.kit; if (!k || !k.open || !(k.items || []).length) return null;
    const cards = shuffle(k.items).slice(0, 3), last = (k.sales || [])[0];
    return { cls:'mk', accent:'var(--blue)', dur: 6000 + cards.length * 1800 + 4500,
      html:'<div class="panel"><span class="tab">KIT MARKET</span><h2>RACE SUITS AND HELMETS FOR SALE</h2><div class="subh">' + (k.forSale || cards.length) + ' designs listed' + (k.sold7d ? ' · ' + k.sold7d + ' sold this week' : '') + '</div><div class="cards">'
        + cards.map((x, i) => '<div class="card" style="--i:' + i + '"><div class="pic">' + picHtml(x.previewUrl, x.type) + '</div><div class="t">' + esc(x.title) + '</div><div class="pr">' + esc(Math.round(x.price).toLocaleString('en-GB')) + '</div>'
          + '<div class="by">credits · by ' + esc(x.creator) + '</div>' + (x.resale ? '<div class="offer">RESALE</div>' : '') + '</div>').join('')
        + '</div>' + (last ? '<div class="foot">Latest sale: <b>' + esc(last.title) + '</b> went to ' + esc(last.buyer) + ' for ' + credits(last.price) + '</div>' : '<div class="foot">Design your own in the Kit Studio on <b>' + SITE + '</b></div>') + '</div>' };
  }
  function teamScene(){
    const t = (feed && feed.teams) || []; if (!t.length) return null; const tm = t[teamIdx++ % t.length];
    return { cls:'mk team', accent:'var(--violet)', dur: 6000 + tm.top.length * 1500 + 4500,
      html:'<div class="panel"><span class="tab">TEAM SPOTLIGHT</span><div class="big">' + esc(tm.team) + '</div><div class="subh">' + tm.members + ' drivers · average IFWL Rating <b style="color:var(--violet)">' + tm.avg + '</b> (' + esc(tm.lv) + ')</div><div class="tm">'
        + tm.top.map((r, i) => '<div class="m" style="--i:' + i + '"><div class="fg">' + (imgUrl(r.avatarUrl) ? '<img src="' + esc(imgUrl(r.avatarUrl)) + '" alt="">' : SIL) + '</div><div class="n">' + esc(person(r.name).name) + '</div><div class="s">' + r.s + '</div></div>').join('') + '</div></div>' };
  }
  const sponsList = () => ((mkt() && mkt().sponsors) || []).filter((b) => imgUrl(b.imageUrl));
  function sponsScene(full){
    const list = sponsList(); if (!list.length) return null; const b = list[sponsIdx++ % list.length];
    return { cls:'mk spons', accent:'var(--teal)', dur:11000, html:'<div class="panel"><span class="tab">OUR PARTNERS</span><div class="ban"><img src="' + esc(imgUrl(b.imageUrl)) + '" alt=""></div><div class="foot">Thank you for supporting IFWL</div></div>' };
  }
  function numsScene(){
    const f = feed || {}, m = mkt() || {};
    const st = [[f.totalLicences, 'LICENSED DRIVERS'], [f.ratedCount, 'RATED DRIVERS'], [f.kitAvatarCount, 'CUSTOM KITS'], [m.activeListings, 'PARTS FOR SALE'], [m.kit && m.kit.open ? m.kit.forSale : 0, 'KIT DESIGNS FOR SALE'], [m.partSalesCount >= 40 ? 0 : m.partSalesCount, 'PARTS SOLD THIS WEEK']].filter((r) => Number(r[0]) > 0).slice(0, 6);
    if (st.length < 3) return null;
    return { cls:'mk nums', accent:'var(--teal)', dur: 6000 + st.length * 900 + 3500,
      html:'<div class="panel"><span class="tab">IFWL RIGHT NOW</span><h2>THE LEAGUE IN NUMBERS</h2><div class="grid">' + st.map((r, i) => '<div class="st" style="--i:' + i + '"><b>' + Number(r[0]).toLocaleString('en-GB') + '</b><span>' + r[1] + '</span></div>').join('') + '</div></div>' };
  }

  function wallScene(m){
    const f = feed || {}; if (!m){ const l = (f.wall || []).filter((w) => Date.now() - w.atMs < 3 * 3600000); if (!l.length) return null; m = l[Math.floor(Math.random() * l.length)]; }
    const p = person(m.name), len = String(m.text).length;
    return { cls:'person wall', accent:'var(--teal)', dur: Math.min(17000, 6500 + len * 95),
      html: figureHtml(m) + '<div class="bub"><span class="tab">FROM THE MESSAGE WALL</span><div class="who">' + (p.num ? '<span class="num">#' + esc(p.num) + '</span>' : '') + esc(p.name) + ' says</div>'
        + '<div class="tx' + (len > 90 ? ' long' : '') + '">' + esc(m.text) + '</div><div class="how">Post yours at ' + SITE + '/licence-wall.html</div></div>' };
  }

  /* ---- scheduler ---- */
  const SEEN_KEY = 'ifwl_stream_seen_v1';
  let seen = new Set(), seenFresh = true;
  try{ const raw = localStorage.getItem(SEEN_KEY); if (raw){ seen = new Set(JSON.parse(raw)); seenFresh = false; } }catch(e){}
  const saveSeen = () => { try{ localStorage.setItem(SEEN_KEY, JSON.stringify([...seen].slice(-300))); }catch(e){} };
  const annShown = {};
  const startedAt = Date.now();
  let evergreenIdx = 0, lastFull = Date.now() - FULL_EVERY + 90000, lastEnd = 0;
  const EVERGREEN = ['top', 'hl', 'events', 'parts', 'imp', 'shop', 'promo', 'hl', 'sold', 'earn', 'kit', 'wall', 'team', 'spons', 'nums'];
  let fullN = 0;

  function nextScene(){
    const f = feed; if (!f) return null;
    const now = Date.now();
    // 1) a brand-new announcement, or one due for a repeat
    for (const a of (f.announcements || [])){
      if (!annShown[a.id] || now - annShown[a.id] >= ANN_EVERY){ annShown[a.id] = now; return annScene(a, a.big); }
    }
    // 2) new licences and level changes nobody has seen on stream yet
    // on a brand-new browser (nothing remembered) only replay the last 3 hours, so the stream never opens with a flood of old news
    const fresh = (list) => (list || []).find((e) => { if (seen.has(e.id)) return false; if (seenFresh && now - e.atMs > 3 * 3600000){ seen.add(e.id); return false; } return true; });
    const nl = fresh(f.newLicences), tc = nl ? null : fresh(f.tierChanges);
    if (nl) seen.add(nl.id); if (tc) seen.add(tc.id);
    saveSeen();
    if (nl) return personScene(nl, 'new');
    if (tc) return personScene(tc, 'tier');
    // a new message from the wall (only the latest few unseen; anything older than 20 minutes is skipped so a busy wall never takes over the stream)
    const wl = (f.wall || []).filter((w) => !seen.has(w.id));
    wl.forEach((w) => { if (now - w.atMs > 20 * 60000) seen.add(w.id); });
    const wm = wl.find((w) => !seen.has(w.id)); if (wm){ seen.add(wm.id); saveSeen(); return wallScene(wm); }
    // 3) full-screen spotlight now and then
    if (now - lastFull >= FULL_EVERY){ lastFull = now; const useSpons = (fullN++ % 3) === 2 && sponsList().length; return (useSpons && sponsScene(true)) || spotlightScene(); }
    // 4) otherwise rotate the evergreen cards
    for (let i = 0; i < EVERGREEN.length; i++){
      const k = EVERGREEN[evergreenIdx++ % EVERGREEN.length];
      const sc = k === 'events' ? eventsScene() : k === 'promo' ? promoScene(false) : k === 'hl' ? highlightScene() : k === 'parts' ? partsScene() : k === 'shop' ? shopScene() : k === 'sold' ? soldScene() : k === 'kit' ? kitScene() : k === 'team' ? teamScene() : k === 'spons' ? sponsScene(false) : k === 'wall' ? wallScene() : k === 'nums' ? numsScene() : boardScene(k);
      if (sc) return sc;
    }
    return null;
  }
  async function loop(){
    await pull(); buildTicker(); pollLive(); await wait(1500);
    for(;;){
      if (RELOAD_H > 0 && Date.now() - startedAt > RELOAD_H * 3600000){ location.reload(); return; }
      const isIdleGap = Date.now() - lastEnd >= GAP;
      const quiet = !!liveState.live;     // race first: no pop-ups while a commentator is on air (the compare has its own spot)
      const sc = isIdleGap && !quiet ? nextScene() : null;
      if (sc){ try{ await runScene(sc); }catch(e){ console.warn('scene failed', e); } lastEnd = Date.now(); }
      else await wait(1000);
    }
  }
  setInterval(async () => { await pull(); buildTicker(); }, POLL);
  setInterval(pollLive, 8000);
  setInterval(tickClock, 1000);

  window.IFWL_STREAM = { feed: () => feed, run: (def) => runScene(def), scenes: { personScene, boardScene, eventsScene, annScene, promoScene, spotlightScene, highlightScene, wallScene, cmpHtml, partsScene, shopScene, soldScene, kitScene, teamScene, sponsScene, numsScene }, pull, buildTicker, pollLive, state: () => liveState };
  if (!Q.has('manual')) loop(); else { pull().then(buildTicker); pollLive(); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
