<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IFWL Command Centre</title>
<style>
:root{
  --ifwl-teal:#1fd6bd; --ifwl-teal-deep:#0e8a78;
  --ifwl-purple:#c65be8; --ifwl-purple-deep:#8b2fb0;
  --ifwl-amber:#ffb238; --ifwl-red:#ff5464; --ifwl-green:#33d99b;
  --ifwl-line:rgba(255,255,255,.10); --ifwl-line-soft:rgba(255,255,255,.06);
  --panel-bg:#12161c; --panel-bg-raised:#171d24;
  --page-bg:#0a0d11; --text-primary:#edf2f3; --text-muted:#93a1a9; --text-dim:#61707a;
  --shadow:0 24px 60px rgba(0,0,0,.55);
  --font-display:'Rajdhani',Arial Narrow,Arial,sans-serif;
  --font-body:'Inter',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--page-bg);color:var(--text-primary);min-height:100vh;
  background-image:radial-gradient(circle at 15% -10%,rgba(31,214,189,.14),transparent 40%),radial-gradient(circle at 100% 10%,rgba(198,91,232,.12),transparent 38%),linear-gradient(180deg,rgba(10,13,17,.93),rgba(9,11,14,.95) 60%,rgba(8,9,12,.97)),url('https://ifwlowner.github.io/ACC-driver-classifier/ifwl_bg.webp');
  background-size:auto,auto,auto,cover;background-position:0 0,0 0,0 0,center top;
  background-attachment:scroll,scroll,scroll,fixed;background-repeat:no-repeat,no-repeat,no-repeat,no-repeat}
h1,h2,h3{font-family:var(--font-display);letter-spacing:.03em}
a{color:inherit;text-decoration:none}

.hero{padding:56px 6% 34px;text-align:center}
.hero img{height:96px;width:auto;max-width:80vw;filter:drop-shadow(0 0 26px rgba(31,214,189,.35));margin-bottom:18px}
.hero h1{font-size:34px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
.hero p{color:var(--text-muted);margin:0;font-size:14px}

.search-wrap{max-width:520px;margin:26px auto 0;padding:0 6%}
.search-wrap input{
  width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--ifwl-line);
  background:#0d1116;color:var(--text-primary);font-size:14px;font-family:var(--font-body);
}
.search-wrap input:focus{outline:none;border-color:var(--ifwl-teal)}

main{max-width:1200px;margin:0 auto;padding:30px 6% 70px}

.category{margin-bottom:34px}
.category h2{
  font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--ifwl-teal);
  margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--ifwl-line-soft);
}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

.tile{
  display:block;background:linear-gradient(165deg,var(--panel-bg-raised),var(--panel-bg));
  border:1px solid var(--ifwl-line);border-radius:14px;padding:18px 18px 16px;
  transition:border-color .15s,transform .15s;box-shadow:var(--shadow);
}
.tile:hover{border-color:var(--ifwl-teal);transform:translateY(-2px)}
.tile .tile-title{font-weight:800;font-size:15px;color:var(--text-primary);margin-bottom:5px;display:flex;align-items:center;gap:8px}
.tile .tile-desc{font-size:12.5px;color:var(--text-muted);line-height:1.5}
.tile .badge{
  display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:999px;background:rgba(198,91,232,.16);color:var(--ifwl-purple);
  border:1px solid rgba(198,91,232,.32);
}
.tile .badge.staff{background:rgba(255,178,56,.14);color:var(--ifwl-amber);border-color:rgba(255,178,56,.32)}
.tile .badge.sponsor{background:rgba(31,214,189,.14);color:var(--ifwl-teal);border-color:rgba(31,214,189,.32)}

.empty-state{text-align:center;color:var(--text-dim);padding:40px;font-size:13px}

.footer-note{text-align:center;color:var(--text-dim);font-size:11.5px;padding:20px 6% 40px}

@media(max-width:600px){
  .hero h1{font-size:26px}
  .hero img{height:76px}
  .tile-grid{grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:14px 14px 12px}
}
@media(max-width:400px){
  .tile-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="hero">
  <img src="https://ifwlowner.github.io/ACC-driver-classifier/ifwllogo1.png" alt="IFWL">
  <h1>IFWL Command Centre</h1>
  <p>Every IFWL page, one place to find it.</p>
</div>

<div class="search-wrap">
  <input type="text" id="linkSearch" placeholder="Search pages...">
</div>

<main id="linksRoot"></main>

<div class="footer-note">IFWL.NET — Command Centre</div>

<script>
/* ====================== EDIT THIS LIST ======================
   One object per page. Add/remove/reorder freely — nothing else
   in this file needs to change. "badge" is optional: "staff" for
   staff-only tools, anything else for a generic purple tag, or
   omit it entirely for no badge.
================================================================= */
const LINKS = [
  {
    category: "IFWL Licence (Main)",
    items: [
      { title: "Licence Centre", desc: "Your licence, tier, stats and ticket history.", url: "licence.html" },
      { title: "Live Timings", desc: "Live and recent ACC session results.", url: "livetimings.html" },
      { title: "TLS Public", desc: "Public track licence scoring.", url: "tls-public.html" },
      { title: "Tune Builder", desc: "Build and share ACC setups.", url: "tunebuilder.html" },
      { title: "Tune Image Builder", desc: "Generate a shareable tune card image.", url: "IFWL_ACC_Tune_Image_Builder_v1_8_Patreon_Gate.html" }
    ]
  },
  {
    category: "IFWL Team",
    items: [
      { title: "My Race Team", desc: "Roster, branding, scouting and stint planning.", url: "raceteamnew.html" },
      { title: "Event Sign-Up", desc: "Register for upcoming SimGrid events.", url: "eventsignup.html" }
    ]
  },
  {
    category: "IFWL Ops",
    items: [
      { title: "Submit a Ticket", desc: "Report an incident or request a review.", url: "ticketportal.html" },
      { title: "Live Stewarding Panel", desc: "Deliberate and review live tickets.", url: "ifwl_live_stewarding.html", badge: "staff" },
      { title: "Head Steward Dashboard", desc: "Finalise tickets and manage penalties.", url: "headsteward.html", badge: "staff" }
    ]
  },
  {
    category: "IFWL.net Website",
    items: [
      { title: "IFWL.net", desc: "The main IFWL website.", url: "https://www.ifwl.net", external: true },
      { title: "Season 3 Rules & Regs", desc: "Full rules and regulations document.", url: "https://docs.google.com/document/d/13ifOF2-YWz1LOaCcEHCF9jbenKAFB4FmuLyAW_FkN7w/edit?usp=sharing", external: true },
      { title: "SimGrid Homepage", desc: "IFWL's community page on SimGrid.", url: "https://www.thesimgrid.com/communities/ifwl/dashboard", external: true },
      { title: "Twitch", desc: "Watch IFWL live.", url: "https://www.twitch.tv/ifwlofficial", external: true },
      { title: "TikTok", desc: "@ifwl.net", url: "https://www.tiktok.com/@ifwl.net", external: true },
      { title: "Instagram", desc: "@ifwlofficial", url: "https://www.instagram.com/ifwlofficial/", external: true },
      { title: "Facebook Group", desc: "Join the community group.", url: "https://www.facebook.com/groups/1629108154527845/", external: true }
    ]
  },
  {
    category: "Sponsors & Affiliates",
    items: [
      { title: "Fanatec", desc: "Shop here — we earn 5%, straight back into IFWL.", url: "https://www.fanatec.com?utm_medium=FAP+Banner&utm_source=IFWL&utm_campaign=General+Links&a_aid=IFWL", external: true, badge: "sponsor" },
      { title: "LOADED (CD Keys)", desc: "Massive game savings — we earn ~0.8% to level up the league.", url: "https://cdkeys.pxf.io/3eBZvy", external: true, badge: "sponsor" },
      { title: "Moza Racing", desc: "Shop here — we earn 5%, reinvested into the racing experience.", url: "https://mozaracing.com/?ref=IFWL", external: true, badge: "sponsor" },
      { title: "Coach Dave Academy", desc: "Better your lap times.", url: "https://coachdaveacademy.com/?ref=ifwl", external: true, badge: "sponsor" },
      { title: "SimGrid Pro", desc: "Get all your race data by signing up to Pro.", url: "https://www.thesimgrid.com/pro?fpr=ifwl", external: true, badge: "sponsor" }
    ]
  }
];
/* =============================================================== */

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(filterText) {
  const root = document.getElementById("linksRoot");
  const q = (filterText || "").trim().toLowerCase();

  const sections = LINKS.map(cat => {
    const items = cat.items.filter(it =>
      !q || it.title.toLowerCase().includes(q) || (it.desc || "").toLowerCase().includes(q)
    );
    if (!items.length) return "";
    return `
      <div class="category">
        <h2>${esc(cat.category)}</h2>
        <div class="tile-grid">
          ${items.map(it => `
            <a class="tile" href="${esc(it.url)}"${it.external ? ' target="_blank" rel="noopener"' : ''}>
              <div class="tile-title">${esc(it.title)} ${it.badge ? `<span class="badge${it.badge === 'staff' ? ' staff' : it.badge === 'sponsor' ? ' sponsor' : ''}">${esc(it.badge)}</span>` : ''}</div>
              <div class="tile-desc">${esc(it.desc || '')}</div>
            </a>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  root.innerHTML = sections || `<div class="empty-state">No pages match "${esc(filterText)}".</div>`;
}

document.getElementById("linkSearch").addEventListener("input", (e) => render(e.target.value));
render('');
</script>

</body>
</html>
