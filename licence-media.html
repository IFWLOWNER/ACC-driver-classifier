<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0d0f13">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<title>IFWL Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/01-main.css?v=b7aed539">
<link rel="stylesheet" href="assets/css/08-rail-theme.css?v=f2124c15">
<style>
  .med-wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  .med-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
  .med-top img{height:30px;display:block}
  .med-top .med-links{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .med-hero h1{margin:14px 0 4px;font-family:var(--font-display,Rajdhani,Arial Narrow,Arial,sans-serif);font-size:44px;letter-spacing:.04em;text-transform:uppercase}
  .med-hero p{margin:0 0 18px;color:var(--text-muted,#5b6576);max-width:720px;line-height:1.55}
  .med-panel{background:var(--panel-bg,#fff);border:1px solid var(--ifwl-line,#e3e7ed);border-radius:16px;padding:18px 20px;margin:0 0 20px}
  .med-panel h3{margin:0 0 4px;font-family:var(--font-display,Rajdhani,Arial Narrow,Arial,sans-serif);letter-spacing:.04em;text-transform:uppercase;font-size:22px}
  .med-panel .med-sub{margin:0 0 14px;font-size:13px;color:var(--text-muted,#5b6576);line-height:1.5}
  .med-form{display:grid;grid-template-columns:2fr 2fr 1.4fr 1.3fr auto;gap:12px;align-items:end}
  .med-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--text-primary,#1a2230)}
  .med-form input,.med-form select{width:100%;padding:9px 11px;border:1px solid var(--ifwl-line,#e3e7ed);background:var(--surface-alt,#f7f8fa);color:var(--text-primary,#1a2230);border-radius:8px;font:500 14px Inter,Arial,sans-serif}
  .med-form .med-url{grid-column:1 / -1}
  @media(max-width:900px){.med-form{grid-template-columns:1fr 1fr}.med-form .med-url{grid-column:1 / -1}.med-form button{grid-column:1 / -1}}
  @media(max-width:520px){.med-form{grid-template-columns:1fr}}
  .med-status{font-size:13px;margin-top:10px;min-height:18px}
  .med-status.err{color:var(--ifwl-red,#c2352a)}.med-status.good{color:var(--ifwl-green,#12875a)}
  .med-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
  .med-chip{border:1px solid var(--ifwl-line,#e3e7ed);background:var(--panel-bg,#fff);color:var(--text-primary,#1a2230);border-radius:999px;padding:7px 14px;font:600 13px Inter,Arial,sans-serif;cursor:pointer}
  .med-chip.active{background:var(--text-primary,#1a2230);border-color:var(--text-primary,#1a2230);color:#fff}
  .med-empty{padding:40px 16px;text-align:center;color:var(--text-muted,#5b6576)}
  .med-note{font-size:13px;color:var(--text-muted,#5b6576);line-height:1.55}
</style>
</head>
<body>
<div class="med-wrap">
  <div class="med-top">
    <a href="licence-home.html" aria-label="IFWL Licence Centre"><img src="ifwllogo1.png" alt="IFWL"></a>
    <div class="med-links">
      <a class="btn ghost" href="licence-home.html">Licence Centre</a>
      <button class="btn teal" id="medLoginBtn" type="button" style="display:none">Login with Discord</button>
    </div>
  </div>

  <div class="med-hero">
    <h1>Media</h1>
    <p>Post race highlights, replays, official streams and driver POV videos from IFWL races. Press play on any video to watch it here.</p>
  </div>

  <section class="med-panel" id="medPostPanel" style="display:none">
    <h3>Add a video</h3>
    <p class="med-sub" id="medPostSub">Paste a YouTube video or a Twitch video or clip.</p>
    <form class="med-form" id="medForm" autocomplete="off">
      <label class="med-url">Video link
        <input type="url" id="medUrl" placeholder="https://www.youtube.com/watch?v=... or https://www.twitch.tv/videos/..." required>
      </label>
      <label>Title
        <input type="text" id="medTitle" maxlength="100" placeholder="e.g. Last lap at the Hairpin" required>
      </label>
      <label>Round
        <input type="text" id="medRound" maxlength="60" placeholder="e.g. Round 3 - Spa" required>
      </label>
      <label>Type
        <select id="medKind" required>
          <option value="">Choose...</option>
          <option value="highlight">Highlight</option>
          <option value="replay">Replay</option>
          <option value="stream">Official stream</option>
          <option value="pov">Driver POV</option>
        </select>
      </label>
      <button class="btn teal" id="medSubmit" type="submit">Add video</button>
    </form>
    <div class="med-status" id="medStatus" role="status"></div>
  </section>

  <section class="med-panel" id="medNotePanel" style="display:none"><div class="med-note" id="medNote"></div></section>

  <div class="med-chips" id="medChips">
    <button class="med-chip active" type="button" data-kind="">All</button>
    <button class="med-chip" type="button" data-kind="highlight">Highlights</button>
    <button class="med-chip" type="button" data-kind="replay">Replays</button>
    <button class="med-chip" type="button" data-kind="stream">Official streams</button>
    <button class="med-chip" type="button" data-kind="pov">Driver POV</button>
  </div>

  <div id="medGrid" class="ifwl-vid-grid wide"><div class="med-empty">Loading videos...</div></div>
</div>

<script src="assets/js/29-media-home.js"></script>
<script>
(function(){
  var M = window.IFWL_MEDIA, esc = M.esc, API = M.API;
  M.css();
  var posts = [], me = null, kind = '';
  var grid = document.getElementById('medGrid'), statusEl = document.getElementById('medStatus');

  function setStatus(msg, cls){ statusEl.textContent = msg || ''; statusEl.className = 'med-status' + (cls ? ' ' + cls : ''); }
  function render(){
    var shown = kind ? posts.filter(function(p){ return p.kind === kind; }) : posts;
    if(!shown.length){ grid.innerHTML = '<div class="med-empty">' + (posts.length ? 'No videos of this type yet.' : 'No videos have been posted yet.') + '</div>'; return; }
    grid.innerHTML = shown.map(function(p){ return M.cardHtml(p, { canRemove: !!(me && me.loggedIn), canRemoveAny: !!(me && me.canRemoveAny) }); }).join('');
  }
  function applyMe(){
    var loginBtn = document.getElementById('medLoginBtn'), panel = document.getElementById('medPostPanel'), notePanel = document.getElementById('medNotePanel'), note = document.getElementById('medNote');
    loginBtn.style.display = me && me.loggedIn ? 'none' : '';
    panel.style.display = me && me.canPost ? '' : 'none';
    var text = '';
    if(!me || !me.loggedIn) text = 'Log in with Discord to add a video. Posting is for Gold Patreon members, staff, Ops and stewards.';
    else if(!me.canPost) text = me.reason || '';
    notePanel.style.display = text ? '' : 'none'; note.textContent = text;
    if(me && me.canPost && !me.canRemoveAny) document.getElementById('medPostSub').textContent = 'Paste a YouTube video or a Twitch video or clip. ' + me.left + ' of ' + me.limit + ' posts left today.';
  }
  async function load(){
    try{
      var d = await M.list(0);
      posts = d.posts || []; me = d.me || null;
      applyMe(); render();
    }catch(e){ grid.innerHTML = '<div class="med-empty">Could not load the videos right now. Try again in a minute.</div>'; }
  }
  M.wirePlay(grid, function(){ return posts; });

  document.getElementById('medChips').addEventListener('click', function(e){
    var b = e.target.closest('.med-chip'); if(!b) return;
    kind = b.getAttribute('data-kind') || '';
    [].forEach.call(document.querySelectorAll('.med-chip'), function(x){ x.classList.toggle('active', x === b); });
    render();
  });

  grid.addEventListener('click', async function(e){
    var b = e.target.closest('[data-vid-remove]'); if(!b) return;
    if(!confirm('Remove this video?')) return;
    try{
      var r = await fetch(API + '?mediaRemove=1&token=' + encodeURIComponent(M.token()), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: b.getAttribute('data-vid-remove') }) });
      var d = await r.json(); if(!r.ok) throw new Error(d.error || 'Could not remove it');
      await load();
    }catch(err){ alert(err.message); }
  });

  document.getElementById('medForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('medSubmit'); btn.disabled = true; setStatus('Adding...', '');
    try{
      var body = { url: document.getElementById('medUrl').value.trim(), title: document.getElementById('medTitle').value.trim(), round: document.getElementById('medRound').value.trim(), kind: document.getElementById('medKind').value };
      var r = await fetch(API + '?mediaPost=1&token=' + encodeURIComponent(M.token()), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      var d = await r.json(); if(!r.ok) throw new Error(d.error || 'Could not add the video');
      document.getElementById('medForm').reset(); setStatus('Video added.', 'good');
      await load();
    }catch(err){ setStatus(err.message, 'err'); }
    btn.disabled = false;
  });

  // Login goes through licence.html (the registered Discord return page) and comes straight back here.
  document.getElementById('medLoginBtn').addEventListener('click', async function(){
    try{
      try{ sessionStorage.setItem('IFWL_LOGIN_RETURN', 'licence-media.html'); }catch(_){}
      var redirect = location.href.replace(/[?#].*$/, '').replace(/[^\/]*$/, '') + 'licence.html';
      var r = await fetch(API + '?start=1&redirect=' + encodeURIComponent(redirect));
      var d = await r.json(); if(!d.url) throw new Error(d.error || 'Could not start the Discord login');
      location.href = d.url;
    }catch(err){ setStatus(err.message, 'err'); }
  });

  load();
})();
</script>
</body>
</html>
