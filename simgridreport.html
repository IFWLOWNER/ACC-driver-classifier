<!DOCTYPE html>
<html>
<head>
  <title>IFWL Incident Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --navy:#0f172a;
      --ink:#111827;
      --muted:#64748b;
      --line:#e2e8f0;
      --soft:#f8fafc;
      --red:#dc2626;
      --red-dark:#991b1b;
      --blue:#2563eb;
      --green:#059669;
      --amber:#b45309;
      --card:#ffffff;
      --shadow:0 10px 30px rgba(15,23,42,.08);
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(220,38,38,.08), transparent 30%),
        radial-gradient(circle at 85% 0%, rgba(37,99,235,.10), transparent 34%),
        #eef2f7;
      color:var(--ink);
      line-height:1.5;
      min-height:100vh;
    }
    a{ color:var(--blue); }
    .wrap{ max-width:960px; margin:0 auto; padding:28px 18px 60px; }

    header{
      display:flex; align-items:center; justify-content:space-between; gap:14px;
      flex-wrap:wrap;
    }
    .brand{ display:flex; align-items:center; gap:12px; }
    .brandMark{
      width:44px; height:44px; border-radius:12px;
      background:linear-gradient(135deg,var(--navy),#1e293b);
      color:#fff; display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:15px; letter-spacing:-.03em;
      box-shadow:var(--shadow);
      flex:0 0 auto;
    }
    .brandText .name{ font-weight:900; font-size:15px; color:var(--navy); letter-spacing:-.02em; }
    .brandText .tagline{ font-size:12px; color:var(--muted); font-weight:700; margin-top:1px; }

    .genBadge{
      font-size:11px; font-weight:800; color:var(--muted);
      background:#fff; border:1px solid var(--line); border-radius:999px;
      padding:6px 12px;
    }

    .titleBlock{ margin-top:26px; }
    .titleBlock h1{
      margin:0; font-size:26px; font-weight:900; color:var(--navy); letter-spacing:-.03em;
    }
    .titleBlock .sub{ margin-top:6px; color:var(--muted); font-weight:650; font-size:14px; }

    .noticeBar{
      margin-top:18px;
      border:1px solid #fecaca; background:linear-gradient(135deg,#fff7f7,#fff);
      color:var(--red-dark);
      border-radius:14px; padding:12px 14px; font-size:13px; font-weight:700;
    }

    .card{
      background:var(--card); border:1px solid var(--line); border-radius:18px;
      box-shadow:var(--shadow); padding:20px; margin-top:18px;
    }
    .cardTitle{
      font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:.06em;
      color:var(--navy); margin:0 0 14px;
      display:flex; align-items:center; gap:8px;
    }

    .factGrid{
      display:grid; grid-template-columns:1fr 1fr; gap:12px;
    }
    .factGrid .full{ grid-column:1 / -1; }
    .fact{
      border:1px solid var(--line); border-radius:14px; background:var(--soft);
      padding:10px 12px;
    }
    .fact .k{
      font-size:10px; text-transform:uppercase; letter-spacing:.08em; font-weight:900; color:var(--muted);
    }
    .fact .v{
      margin-top:4px; font-size:14px; font-weight:800; color:var(--navy); word-break:break-word;
    }

    .driverPair{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .driverBox{
      border-radius:14px; padding:12px 14px; border:1px solid var(--line);
    }
    .driverBox.accused{ background:linear-gradient(135deg,#fff,#fff7f7); border-color:#fecaca; }
    .driverBox.reporter{ background:linear-gradient(135deg,#fff,#f8fbff); border-color:#bfdbfe; }
    .driverBox .k{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; font-weight:900; color:var(--muted); }
    .driverBox .v{ margin-top:4px; font-size:16px; font-weight:900; color:var(--navy); }

    .prose{ font-size:14px; color:#334155; white-space:pre-wrap; word-break:break-word; line-height:1.55; }

    .videoWrap{
      position:relative; width:100%; padding-top:56.25%; background:#000; border-radius:14px;
      overflow:hidden; border:1px solid var(--line); margin-top:12px;
    }
    .videoWrap iframe, .videoWrap video{ position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
    .evidenceLinkRow{ margin-top:10px; font-size:13px; }
    .evidenceEmpty{ color:var(--muted); font-size:13px; font-weight:700; }

    .timeline{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
    .tlItem{
      border:1px solid var(--line); border-radius:14px; background:var(--soft);
      padding:12px 14px;
    }
    .tlItem .tlHead{
      display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap;
    }
    .tlItem .who{ font-weight:900; color:var(--navy); font-size:13px; }
    .tlItem .when{ font-size:11px; color:var(--muted); font-weight:700; }
    .tlItem .body{ margin-top:6px; font-size:13px; color:#334155; white-space:pre-wrap; word-break:break-word; line-height:1.5; }
    .tlEmpty{ color:var(--muted); font-size:13px; font-weight:700; }

    .rulingBox{
      border:1px solid #86efac; background:linear-gradient(135deg,#ecfdf5,#f6fff9);
      border-radius:14px; padding:14px 16px;
    }
    .rulingBox.pending{
      border-color:#fcd34d; background:linear-gradient(135deg,#fffbeb,#fffdf7);
    }
    .rulingTop{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; }
    .rulingStatus{
      font-weight:900; font-size:13px; color:#065f46;
    }
    .rulingBox.pending .rulingStatus{ color:#92400e; }
    .rulingGrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .rulingGrid .fact{ background:#fff; }

    .noteBox{
      border:1px solid #bfdbfe; background:linear-gradient(135deg,#eff6ff,#fff);
      border-radius:14px; padding:14px 16px; color:#1e3a8a; font-size:13px; font-weight:700; white-space:pre-wrap;
    }

    footer{
      margin-top:30px; text-align:center; color:var(--muted); font-size:12px; font-weight:650;
    }
    footer .fine{ margin-top:6px; font-size:11px; }

    .stateBox{
      margin-top:60px; text-align:center; color:var(--muted);
    }
    .stateBox h2{ color:var(--navy); font-size:20px; margin:0 0 8px; }

    @media (max-width: 640px){
      .factGrid, .driverPair, .rulingGrid{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

  <div class="wrap" id="app">
    <div class="stateBox" id="loadingState">
      <h2>Loading report…</h2>
      <div>Please wait a moment.</div>
    </div>
  </div>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="./firebase-init.js"></script>

  <script>
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function normalizeUrl(u) {
      const s = (u || "").trim();
      if (!s) return "";
      if (!/^https?:\/\//i.test(s) && !s.startsWith("mailto:")) return "https://" + s;
      return s;
    }

    function youtubeIdFromUrl(url) {
      try {
        const u = new URL(url);
        const host = u.hostname.toLowerCase();
        if (host === "youtu.be") return (u.pathname || "").replace("/", "").trim();
        if (host.includes("youtube.com")) {
          if (u.pathname.startsWith("/watch")) return (u.searchParams.get("v") || "").trim();
          if (u.pathname.startsWith("/shorts/")) return (u.pathname.split("/shorts/")[1] || "").split(/[/?#]/)[0].trim();
          if (u.pathname.startsWith("/embed/")) return (u.pathname.split("/embed/")[1] || "").split(/[/?#]/)[0].trim();
        }
      } catch {}
      return "";
    }

    function evidenceBlockHtml(label, url) {
      const u = normalizeUrl(url);
      if (!u) return "";
      const yt = youtubeIdFromUrl(u);
      let embed = "";
      if (yt) {
        embed = `
          <div class="videoWrap" aria-label="${escapeHtml(label)}">
            <iframe src="https://www.youtube.com/embed/${encodeURIComponent(yt)}" title="${escapeHtml(label)}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen></iframe>
          </div>`;
      } else if (/\.(mp4|webm|ogg)(\?|#|$)/i.test(u)) {
        embed = `
          <div class="videoWrap" aria-label="${escapeHtml(label)}">
            <video controls src="${escapeHtml(u)}"></video>
          </div>`;
      }
      return `
        <div style="margin-top:14px;">
          <div class="fact"><div class="k">${escapeHtml(label)}</div><div class="v" style="font-size:13px;"><a href="${escapeHtml(u)}" target="_blank" rel="noopener">Open link</a></div></div>
          ${embed}
        </div>`;
    }

    function fmtDate(ms) {
      if (!ms) return null;
      try { return new Date(ms).toLocaleString(); } catch { return null; }
    }

    function renderNotFound(msg) {
      document.getElementById("app").innerHTML = `
        <div class="stateBox">
          <h2>Report not found</h2>
          <div>${escapeHtml(msg || "This SimGrid report link is invalid or has not been generated yet.")}</div>
        </div>`;
    }

    function renderReport(r) {
      const ticketId = r.ticketId || "—";
      const generatedAt = fmtDate(r.submittedAtMs) || "—";

      const isFinal = String(r.status || "").toLowerCase() === "finalised";

      const rulingHtml = isFinal ? `
        <div class="rulingBox">
          <div class="rulingTop">
            <div class="rulingStatus">✅ Finalised — official IFWL ruling</div>
            ${r.finalisedAtMs ? `<div style="font-size:12px;color:#065f46;font-weight:700;">${escapeHtml(fmtDate(r.finalisedAtMs) || "")}</div>` : ""}
          </div>
          <div class="rulingGrid">
            <div class="fact"><div class="k">Rules code applied</div><div class="v">${escapeHtml(r.finalPenaltyCode || "—")}</div></div>
            <div class="fact"><div class="k">Penalty / time</div><div class="v">${escapeHtml(r.finalPenaltyTime || "—")}</div></div>
            <div class="fact full"><div class="k">Penalty applied / result</div><div class="v">${escapeHtml(r.finalPenalty || "—")}</div></div>
            <div class="fact full"><div class="k">Official steward decision</div><div class="v" style="font-weight:650; font-size:13px;">${escapeHtml(r.stewardDecision || "—")}</div></div>
            <div class="fact full"><div class="k">Finalising steward</div><div class="v">${escapeHtml(r.finalStewardTag || "—")}</div></div>
          </div>
        </div>
      ` : `
        <div class="rulingBox pending">
          <div class="rulingTop">
            <div class="rulingStatus">⏳ Not yet finalised (status: ${escapeHtml(r.status || "Under Review")})</div>
          </div>
          <div style="margin-top:10px; font-size:13px; color:#92400e; font-weight:700;">
            IFWL's internal review of this ticket was still in progress at the time this report was generated. No final ruling has been recorded yet.
          </div>
        </div>
      `;

      const actions = Array.isArray(r.stewardActions) ? r.stewardActions : [];
      const timelineHtml = actions.length
        ? actions.map(a => `
            <div class="tlItem">
              <div class="tlHead">
                <div class="who">${escapeHtml(a.who || "Unknown")}</div>
                <div class="when">${escapeHtml(a.when || "")}</div>
              </div>
              <div class="body">${escapeHtml(a.text || "")}</div>
            </div>
          `).join("")
        : `<div class="tlEmpty">No steward actions or comments were recorded on this ticket.</div>`;

      const evidenceHtml =
        (evidenceBlockHtml("Reported evidence", r.proofUrl) || "") +
        (evidenceBlockHtml("Gold video evidence", r.videoProofUrl) || "");

      const noteHtml = (r.note || "").trim()
        ? `<div class="card"><div class="cardTitle">📝 Note to SimGrid staff</div><div class="noteBox">${escapeHtml(r.note)}</div></div>`
        : "";

      document.getElementById("app").innerHTML = `
        <header>
          <div class="brand">
            <div class="brandMark">IF</div>
            <div class="brandText">
              <div class="name">IFWL.NET</div>
              <div class="tagline">Official Incident Report</div>
            </div>
          </div>
          <div class="genBadge">Ticket ${escapeHtml(ticketId)}</div>
        </header>

        <div class="titleBlock">
          <h1>Incident Report — Prepared for SimGrid Staff Review</h1>
          <div class="sub">Generated ${escapeHtml(generatedAt)} by ${escapeHtml(r.submittedBy || "IFWL Head Steward")}</div>
        </div>

        <div class="noticeBar">
          This is an official IFWL league document shared directly with SimGrid staff for review. It contains driver information and incident evidence handled under IFWL's stewarding process.
        </div>

        <div class="card">
          <div class="cardTitle">🏁 Incident summary</div>
          <div class="driverPair">
            <div class="driverBox accused">
              <div class="k">Accused driver</div>
              <div class="v">${escapeHtml(r.accused || "—")}</div>
            </div>
            <div class="driverBox reporter">
              <div class="k">Reporting driver</div>
              <div class="v">${escapeHtml(r.reporter || "—")}</div>
            </div>
          </div>
          <div class="factGrid" style="margin-top:12px;">
            <div class="fact"><div class="k">Competition</div><div class="v">${escapeHtml(r.competition || "—")}</div></div>
            <div class="fact"><div class="k">Event</div><div class="v">${escapeHtml(r.event || "—")}</div></div>
            <div class="fact full"><div class="k">Rule breach cited</div><div class="v">${escapeHtml(r.ruleBreach || "—")}</div></div>
          </div>
          ${r.fullIncident ? `<div style="margin-top:14px;"><div class="fact"><div class="k">Incident description</div></div><div class="prose" style="margin-top:8px;">${escapeHtml(r.fullIncident)}</div></div>` : ""}
        </div>

        <div class="card">
          <div class="cardTitle">🎥 Evidence</div>
          ${evidenceHtml || `<div class="evidenceEmpty">No evidence links were recorded on this ticket.</div>`}
        </div>

        <div class="card">
          <div class="cardTitle">🧾 IFWL steward actions &amp; comments</div>
          <div class="timeline">${timelineHtml}</div>
        </div>

        <div class="card">
          <div class="cardTitle">⚖️ Final IFWL ruling</div>
          ${rulingHtml}
        </div>

        ${noteHtml}

        <footer>
          IFWL.NET — Official Racing League. This report was generated by an IFWL Head Steward and is intended solely for SimGrid staff review.
          <div class="fine">Ticket ${escapeHtml(ticketId)} · Report generated ${escapeHtml(generatedAt)}</div>
        </footer>
      `;
    }

    async function main() {
      const params = new URLSearchParams(window.location.search);
      const ticketId = (params.get("ticket") || params.get("ticketId") || "").trim();

      if (!ticketId) {
        renderNotFound("No ticket was specified in this link.");
        return;
      }

      try {
        const snap = await db.collection("simgrid_reports").doc(ticketId).get();
        if (!snap.exists) {
          renderNotFound("No SimGrid report has been generated for this ticket yet.");
          return;
        }
        renderReport(snap.data() || {});
      } catch (e) {
        console.error("Failed to load SimGrid report:", e);
        renderNotFound("Something went wrong loading this report. Please try again shortly.");
      }
    }

    main();
  </script>
</body>
</html>
